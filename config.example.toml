# ============================================================
#  NUVORA 配置文件
#  推荐：运行 start.bat/start.sh，在终端输入 /setup 配置并保存。
#  环境变量可覆盖：NUVORA_API_KEY / NUVORA_BASE_URL / NUVORA_MODEL
#  不知道有什么模型？先运行：
#    python -m nuvora models
# ============================================================

[model]
# OpenAI Chat Completions 兼容端点；填写服务商提供的完整基础地址。
# 末尾是否需要 /v1 由端点决定，不要填写完整的 /chat/completions 路径。
# 本地兼容服务也可使用 HTTP 地址。
base_url = "https://open.bigmodel.cn/api/paas/v4"

# API Key；本地服务是否需要鉴权由服务端决定。
api_key = ""

# 模型名称，须与端点上的名称一致。
# 留空则无法对话；可运行 `python -m nuvora models` 探测。
model = ""

temperature = 0.7

[agent]
# 单次任务中模型最多可进行的工具调用轮数
max_iterations = 30

[tools]
# Agent 工具开关（终端 /setup 也可保存）
web_enabled = true
files_enabled = true
python_enabled = true
# run_python 单次执行超时（秒，上限 120）
python_timeout = 30
# web_search 默认返回条数
web_search_max_results = 5

[memory]
# 长期记忆开关（remember / recall / forget 工具）
enabled = true

[cli]
# 交互终端逐 token 更新 Markdown；重定向输出时显示完整消息。
# 设为 false 则等待整个 Agent 回合结束后输出。
stream = true
